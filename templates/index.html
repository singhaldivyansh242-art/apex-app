<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Interface</title>
    <style>
        body { background-color: #050505; color: #00ff00; font-family: monospace; text-align: center; padding: 5%; margin: 0; }
        .btn { background-color: #00ff00; color: #000; border: none; padding: 15px 30px; font-size: 1.2em; cursor: pointer; border-radius: 10px; box-shadow: 0 0 10px #00ff00; font-weight: bold; margin: 10px; transition: 0.2s; }
        .btn:active { background-color: #fff; box-shadow: 0 0 20px #fff; }
        #textInput { padding: 15px; font-size: 1.2em; width: 60%; max-width: 400px; border-radius: 10px; border: 1px solid #00ff00; background: #111; color: #00ff00; margin-top: 20px; font-family: monospace; outline: none; }
        #status { margin-top: 20px; font-style: italic; color: #aaa; }
        #response { margin-top: 30px; font-size: 1.2em; white-space: pre-wrap; line-height: 1.5; text-align: left; background: #111; padding: 20px; border-radius: 8px; border: 1px solid #333; display: inline-block; width: 80%; max-width: 600px; }
    </style>
</head>
<body>
    <h1>APEX ONLINE</h1>
    
    <div>
        <button id="micBtn" class="btn">🎤 VOICE INPUT</button>
    </div>
    
    <div>
        <input type="text" id="textInput" placeholder="Type a message...">
        <button id="sendBtn" class="btn">✉️ SEND TEXT</button>
    </div>

    <div id="status">Systems nominal. Awaiting input...</div>
    <div id="response"></div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const textInput = document.getElementById('textInput');
        const statusDiv = document.getElementById('status');
        const responseDiv = document.getElementById('response');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        let recognition;

        if (!SpeechRecognition) {
            statusDiv.innerText = "Speech Recognition API is not supported in this browser.";
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                statusDiv.innerText = "Listening...";
                responseDiv.innerText = "";
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textInput.value = transcript; 
                sendToApex(transcript, true); 
            };
        }

        sendBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (text) sendToApex(text, false); 
        });

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = textInput.value.trim();
                if (text) sendToApex(text, false); 
            }
        });

        async function sendToApex(message, isVoice) {
            statusDiv.innerText = `Transmitting: "${message}"...`;
            responseDiv.innerText = "Processing...";
            synth.cancel();

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await res.json();
                
                responseDiv.innerText = data.reply;
                statusDiv.innerText = "Response received.";

                if (isVoice) {
                    const utterance = new SpeechSynthesisUtterance(data.reply);
                    synth.speak(utterance);
                }
            } catch (err) {
                statusDiv.innerText = "Connection to APEX core failed.";
                responseDiv.innerText = "";
            }
        }
    </script>
</body>
</html>
