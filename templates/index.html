<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Voice AI</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #00ffcc; letter-spacing: 2px; }
        .mic-btn {
            background-color: #ff3b3b;
            border: none;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            font-size: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff3b3b;
            transition: 0.3s;
            margin: 30px 0;
            -webkit-tap-highlight-color: transparent;
        }
        .mic-btn.recording {
            background-color: #00ffcc;
            box-shadow: 0 0 35px #00ffcc;
            transform: scale(1.1);
        }
        #status { font-size: 1.2rem; color: #aaa; margin-bottom: 10px; }
        #response-text { text-align: center; max-width: 80%; color: #00ffcc; }
    </style>
</head>
<body>

    <h1>APEX ⚡</h1>
    <div id="status">Tap the mic and speak...</div>
    <button id="micBtn" class="mic-btn">🎙️</button>
    <div id="response-text"></div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusTxt = document.getElementById('status');
        const responseTxt = document.getElementById('response-text');

        // Setup Speech Recognition (Strictly controlled, NO infinite loops!)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusTxt.innerText = "Browser doesn't support speech recognition. ❌";
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false; // Only listens once per tap
            recognition.interimResults = false; 

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    micBtn.classList.add("recording");
                    statusTxt.innerText = "Listening... 👂 (Speak now)";
                } catch (e) {
                    console.log("Already listening!");
                }
            });

            // When you finish speaking, it stops automatically
            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                statusTxt.innerText = "Thinking... 🤔";
                responseTxt.innerText = `You: "${transcript}"`;
                
                // Send the text to your app.py
                try {
                    const response = await fetch('/ask', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: transcript, isVoice: true })
                    });
                    
                    const data = await response.json();
                    statusTxt.innerText = "Apex is speaking... 🔊";
                    responseTxt.innerText = data.reply;

                    // Play the base64 audio from ElevenLabs!
                    if (data.audio) {
                        const audio = new Audio("data:audio/mpeg;base64," + data.audio);
                        audio.play();
                        
                        audio.onended = () => {
                            statusTxt.innerText = "Tap the mic and speak...";
                        };
                    } else {
                        statusTxt.innerText = "Tap the mic and speak... (No audio returned)";
                    }

                } catch (error) {
                    statusTxt.innerText = "Connection Error ❌";
                    console.error(error);
                }
            };

            // This ensures the button resets properly when it stops listening
            recognition.onend = () => {
                micBtn.classList.remove("recording");
                if (statusTxt.innerText.includes("Listening")) {
                    statusTxt.innerText = "Didn't catch that. Tap to try again.";
                }
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove("recording");
                statusTxt.innerText = "Error: " + event.error + " 🚫";
            };
        }
    </script>
</body>
</html>
